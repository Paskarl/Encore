<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick overlay</title>
<style>
/* OBS browser source: transparent page, light text with a shadow so it reads on any scene. */
:root { --text: #ffffff; --muted: rgba(255, 255, 255, .72); --accent: #b79bff; --panel: rgba(12, 14, 20, .62); }
html, body { margin: 0; background: transparent; color: var(--text); font: 600 22px/1.3 "Segoe UI", system-ui, sans-serif; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); overflow: hidden; }
.box { display: inline-block; max-width: calc(100vw - 24px); margin: 12px; padding: 12px 16px; border-radius: 12px; background: var(--panel); }
.label { font-size: .62em; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.now .title { font-size: 1.15em; }
.title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: .78em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { color: var(--accent); }
ol { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: n; }
li { counter-increment: n; display: flex; gap: 8px; padding: 3px 0; min-width: 0; }
li::before { content: counter(n) "."; color: var(--muted); font-size: .8em; min-width: 1.4em; padding-top: .15em; }
li > div { min-width: 0; }
.section + .section { margin-top: 10px; }
.hint { font-size: .7em; color: var(--muted); margin-top: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box" id="box" hidden>
  <div class="section now" id="now-section" hidden>
    <div class="label">Now playing</div>
    <div class="title" id="now-title"></div>
    <div id="now-meta"></div>
  </div>
  <div class="section" id="next-section" hidden>
    <div class="label">Up next</div>
    <ol id="next"></ol>
  </div>
  <div class="hint" id="hint" hidden></div>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const showQueue = params.get("queue") !== "0";
const max = Math.min(Math.max(parseInt(params.get("max") || "5", 10) || 5, 1), 15);
// OBS on another PC: http://<pc>:47322/overlay#token=<pairing token>. On this PC no token is needed.
const m = location.hash.match(/token=([0-9a-f]{32})/);
const token = m ? m[1] : "";
const $ = id => document.getElementById(id);
function line(parent, title, artist, who) {
  const t = document.createElement("div");
  t.className = "title";
  t.textContent = title;
  parent.append(t, metaLine(artist, who));
}
function metaLine(artist, who) {
  const meta = document.createElement("div");
  meta.className = "meta";
  if (artist) meta.append(artist);
  if (who) {
    if (artist) meta.append(" · ");
    meta.append("requested by ");
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    meta.append(w);
  }
  return meta;
}
async function refresh() {
  let d;
  try {
    const res = await fetch("overlay/state", token ? { headers: { "Authorization": "Bearer " + token } } : {});
    if (!res.ok) throw 0;
    d = await res.json();
  } catch (e) {
    $("box").hidden = true;
    return;
  }
  $("now-section").hidden = !d.now;
  if (d.now) {
    $("now-title").textContent = d.now.title;
    $("now-meta").replaceChildren(metaLine(d.now.artist, d.now.requestedBy));
  }
  const next = showQueue ? d.next.slice(0, max) : d.next.slice(0, 1);
  $("next-section").hidden = !next.length;
  $("next").replaceChildren(...next.map(s => { const li = document.createElement("li"); const div = document.createElement("div"); line(div, s.title, s.artist, s.requestedBy); li.append(div); return li; }));
  const more = d.next.length - next.length;
  const hint = more > 0 && showQueue ? "+" + more + " more" : d.open ? "Request songs with !sr <title>" : "";
  $("hint").hidden = !hint;
  $("hint").textContent = hint;
  $("box").hidden = !d.now && !next.length && !hint;
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
